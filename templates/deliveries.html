{% extends 'base.html' %}{% block content %}<h2>Calf Delivery Tracking</h2><form method='post'><select name='animal_id'>{% for a in animals %}<option value='{{ a.id }}'>{{ a.code }} - {{ a.name }}</option>{% endfor %}</select><input name='calf_name' placeholder='Calf Name' required><select name='calf_gender'><option>Male</option><option>Female</option></select><input type='date' name='delivery_date' required><input name='mother_health' placeholder='Mother health' required><button>Save Delivery</button></form><table><tr><th>Mother</th><th>Calf</th><th>Gender</th><th>Date</th><th>Mother Health</th></tr>{% for d in deliveries %}<tr><td>{{ d.animal_code }} - {{ d.animal_name }}</td><td>{{ d.calf_name }}</td><td>{{ d.calf_gender }}</td><td>{{ d.delivery_date }}</td><td>{{ d.mother_health }}</td></tr>{% endfor %}</table>{% endblock %}
