{% extends 'base.html' %}{% block content %}<h2>My Order Status</h2><table><tr><th>ID</th><th>Product</th><th>Price</th><th>Payment</th><th>Delivery</th><th>SMS</th></tr>{% for o in orders %}<tr><td>{{ o.id }}</td><td>{{ o.product_name }}</td><td>₹{{ o.price }}</td><td>{{ o.payment_status }}</td><td>{{ o.delivery_status }}</td><td>{% if o.sms_sent %}Sent{% else %}Pending{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
