{% extends 'base.html' %}{% block content %}<h2>Cart</h2><table><tr><th>Product</th><th>Qty</th><th>Subtotal</th></tr>{% for row in items %}<tr><td>{{ row.product.name }}</td><td>{{ row.qty }}</td><td>₹{{ row.subtotal }}</td></tr>{% endfor %}</table><h3>Total: ₹{{ total }}</h3><a href='{{ url_for("checkout") }}'><button>Proceed to Delivery Details</button></a>{% endblock %}
