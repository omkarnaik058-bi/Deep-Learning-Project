{% extends 'base.html' %}{% block content %}<h2>Admin Product Management</h2><form method='post'><input name='name' placeholder='Product Name' required><input name='price' type='number' step='0.01' placeholder='Price' required><input name='stock' type='number' placeholder='Stock' required><button>Add Product</button></form><table><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr>{% for p in products %}<tr><td>{{ p.id }}</td><td>{{ p.name }}</td><td>₹{{ p.price }}</td><td>{{ p.stock }}</td><td><a href='{{ url_for("delete_product", product_id=p.id) }}'>Delete</a></td></tr>{% endfor %}</table><p>Edit Product: Coming soon</p>{% endblock %}
