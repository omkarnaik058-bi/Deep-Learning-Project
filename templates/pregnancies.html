{% extends 'base.html' %}{% block content %}<h2>Pregnancy Tracking</h2><form method='post'><select name='animal_id'>{% for a in animals %}<option value='{{ a.id }}'>{{ a.code }} - {{ a.name }}</option>{% endfor %}</select><select name='pregnant'><option>Yes</option><option>No</option></select><input type='number' name='months' placeholder='Months'><input type='number' name='days' placeholder='Days'><button>Save Pregnancy</button></form><table><tr><th>Animal</th><th>Status</th><th>Months</th><th>Days</th><th>Expected Date</th></tr>{% for p in pregnancies %}<tr><td>{{ p.animal_code }} - {{ p.animal_name }}</td><td>{{ p.pregnant }}</td><td>{{ p.months }}</td><td>{{ p.days }}</td><td>{{ p.expected_date or '-' }}</td></tr>{% endfor %}</table>{% endblock %}
